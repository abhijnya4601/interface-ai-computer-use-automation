# Optional: keep a Hugging Face Space in sync with this repo on every push.
# Inert until you configure BOTH:
#   - repo secret   HF_TOKEN   = a Hugging Face access token with write scope
#   - repo variable HF_SPACE   = "<you>/<space-name>"
# Settings → Secrets and variables → Actions. Until then this job just prints "not configured".
name: Deploy to Hugging Face Space

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check config
        id: cfg
        run: |
          if [ -n "${{ secrets.HF_TOKEN }}" ] && [ -n "${{ vars.HF_SPACE }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "HF_TOKEN secret and/or HF_SPACE variable not set — skipping deploy."
          fi

      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - name: Push to the Space
        if: steps.cfg.outputs.ready == 'true'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git push --force "https://user:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" \
            "HEAD:refs/heads/main"
