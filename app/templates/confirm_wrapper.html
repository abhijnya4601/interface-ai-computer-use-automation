<!DOCTYPE html>
<html>
<head><title>Confirm Sub-Account</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="pg-wrap">
<h1>Review and Confirm</h1>
<p>Please review the details below before opening this sub-account.</p>
<iframe class="frm-embed" title="Confirmation" style="width:100%;height:400px;border:1px solid #999"
  src="/member/{{ member.member_id }}/confirm-frame?account_type={{ account_type }}&nickname={{ nickname|urlencode }}&deposit_cents={{ deposit_cents }}">
</iframe>
</div>
</body>
</html>
