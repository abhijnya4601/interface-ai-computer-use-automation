# Safety allowlist — loaded once at process startup, checked before every action in
# BOTH the discovery loop and the replay engine. Anything outside this raises
# GuardrailViolation and halts; there is no silent skip.

# General allowlist — checked for replay (the production execution path, where the LLM is never
# involved and this system's own guardrails are the only thing standing between the automation
# and the live app).
allowed_domains:
  - "localhost:5050"

# Discovery-only allowlist — deliberately separate from (and here, a strict subset of)
# allowed_domains above. Every discovery turn sends the observed page content to a third-party
# LLM API; a real deployment must NEVER let discovery run against a live production session with
# real customer data, only staging/test environments seeded with synthetic data (see REPORT.md
# Safety / DECISIONS.md D18). Keeping this as its own list, checked with phase="discovery", makes
# that rule an enforced technical control instead of just a documented one: adding a production
# domain to allowed_domains (for replay) does NOT automatically permit discovery there too.
discovery_allowed_domains:
  - "localhost:5050"

allowed_actions:
  - click
  - type
  - navigate
  - extract
  - select
  - wait_for

# Explicit route-level denylist, checked even for an otherwise-allowed domain/action.
# Empty for the mock app; a real deployment would list admin/bulk-operation routes here.
blocked_routes: []
