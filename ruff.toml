# Conservative first pass: the rules that catch real mistakes (undefined names, unused imports,
# obviously-wrong code) plus import sorting and pyupgrade. Deliberately NOT enabling
# flake8-bandit (S) or flake8-blind-except (BLE) yet - the perception and replay code swallows
# exceptions on purpose while probing the DOM across frames, and that's a design decision to
# revisit rule-by-rule, not something to mass-"fix".
target-version = "py312"
line-length = 100

[lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # long lines: many are deliberate one-line comments explaining a decision
    "E402",    # `sys.path.insert(...)` before local imports is the established pattern in
               # scripts/ and the two second-server modules; not worth restructuring
    "SIM102",  # nested if: a couple read more clearly as-is
    "B008",    # function call in default arg: not used in a way that bites here
    # --- deferred, pre-existing, to tighten rule-by-rule in a dedicated cleanup pass ---
    "B905",    # zip() without strict=: one call in perception.py, frames are known equal-length
    "SIM105",  # contextlib.suppress vs try/except/pass: 2 spots in escalation/controller.py
    "RUF005",  # iterable unpacking vs concatenation: one test helper
    "UP047",   # PEP 695 `def f[T]()` generics - style preference, not adopting repo-wide yet
]

[lint.per-file-ignores]
"tests/*" = ["B011", "E741"]  # `l` as a throwaway in a perception-tree test
